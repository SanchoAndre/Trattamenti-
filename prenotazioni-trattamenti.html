<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fisioterapia LSDF Limerick 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16332C;
    --pitch:#1C4B3E;
    --pitch-dark:#123027;
    --sage-bg:#F5F4EC;
    --card:#FFFFFF;
    --line:#E1DED0;
    --free:#2E8B57;
    --free-bg:#E7F3EB;
    --taken:#8A8577;
    --taken-bg:#EFEDE3;
    --amber:#E8A63B;
    --amber-dark:#C4841F;
    --danger:#B5453D;
    --radius:14px;
    --team-tequila:#6B3FA0;
    --team-tequila-bg:#F1E9FA;
    --team-cotarica:#A93226;
    --team-cotarica-bg:#FBEAE8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--sage-bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:60px;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk',system-ui,sans-serif;
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:0 18px;
  }
  header.top{
    background:var(--pitch);
    color:#fff;
    padding:28px 0 22px;
    margin-bottom:0;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#BFE0D0;
    font-weight:600;
    margin:0 0 6px;
  }
  header.top h1{
    font-size:24px;
    font-weight:700;
    margin:0;
    line-height:1.15;
  }
  .teamlogos{
    display:flex;
    gap:18px;
    margin-top:14px;
  }
  .teamlogo{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
  }
  .teamlogo img{
    width:46px;
    height:46px;
    border-radius:50%;
    object-fit:cover;
    box-shadow:0 0 0 2px rgba(255,255,255,.35);
    background:#fff;
  }
  .teamlogo span{
    font-size:10.5px;
    font-weight:600;
    color:#BFE0D0;
    text-align:center;
    line-height:1.2;
  }
  .tabbar{
    display:flex;
    gap:8px;
    margin-top:18px;
  }
  .tabbtn{
    flex:1;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    padding:9px 6px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s;
  }
  .tabbtn.active{
    background:var(--amber);
    border-color:var(--amber);
    color:#26200F;
  }
  .tabbtn:not(.active):hover{
    background:rgba(255,255,255,.2);
  }
  main{padding-top:20px;}
  .daygroup{margin-bottom:22px;}
  .dayhead{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin:0 0 10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .dayhead .dname{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--pitch-dark);
    text-transform:capitalize;
  }
  .dayhead .dcount{
    font-size:12px;
    color:var(--taken);
  }
  .slotcard{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:10px;
    display:flex;
    align-items:flex-start;
    gap:12px;
  }
  .timerow{
    display:flex;
    gap:8px;
    align-items:stretch;
  }
  .timerow .slotcard{
    flex:1;
    min-width:0;
  }
  .timerow .slotcard.paired{
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:11px 8px;
    gap:6px;
  }
  .timerow .slotcard.paired .disc{
    width:40px;
    height:40px;
  }
  .timerow .slotcard.paired .disc .n{font-size:13px;}
  .timerow .slotcard.paired .slotinfo{width:100%;}
  .timerow .slotcard.paired .slottime{font-size:14.5px;}
  .timerow .slotcard.paired .statuspill{margin-left:0; display:block; margin-top:4px; width:fit-content; margin-left:auto; margin-right:auto;}
  .disc{
    flex:none;
    width:48px;
    height:48px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    line-height:1;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    position:relative;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.55), inset 0 0 0 4px rgba(0,0,0,.06);
  }
  .disc.free{background:var(--free); color:#fff;}
  .disc.taken{background:var(--taken); color:#fff;}
  .disc.done{background:var(--pitch); color:#fff;}
  .disc .n{font-size:15px;}
  .disc .u{font-size:8px; letter-spacing:.04em; text-transform:uppercase; opacity:.9;}
  .slotinfo{flex:1; min-width:0;}
  .slottime{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:16.5px;
    color:var(--ink);
  }
  .statuspill{
    display:inline-block;
    font-size:11px;
    font-weight:600;
    padding:2px 9px;
    border-radius:999px;
    margin-left:8px;
    vertical-align:middle;
    letter-spacing:.02em;
  }
  .statuspill.free{background:var(--free-bg); color:var(--free);}
  .statuspill.taken{background:var(--taken-bg); color:var(--taken);}
  .statuspill.done{background:var(--sage-bg); color:var(--pitch-dark); box-shadow:inset 0 0 0 1px var(--pitch);}
  .bookedname{
    margin-top:4px;
    font-size:13.5px;
    color:var(--taken);
    word-break:break-word;
  }
  .bookedname b{color:var(--ink);}
  .bookform{
    margin-top:9px;
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .bookform button{width:100%;}
  .notetext{
    margin-top:4px;
    font-size:12.5px;
    color:var(--taken);
    font-style:italic;
    word-break:break-word;
  }
  .notetext b{font-style:normal; color:var(--ink);}
  input[type=text], input[type=date], input[type=time], input[type=number], input[type=password]{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:9px;
    background:#fff;
    color:var(--ink);
    outline:none;
    width:100%;
  }
  input:focus{border-color:var(--pitch);}
  textarea{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:9px;
    background:#fff;
    color:var(--ink);
    outline:none;
    width:100%;
    resize:vertical;
  }
  textarea:focus{border-color:var(--pitch);}
  select{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:9px;
    background:#fff;
    color:var(--ink);
    outline:none;
    width:100%;
  }
  select:focus{border-color:var(--pitch);}
  textarea.autonote{
    resize:none;
    overflow:hidden;
    min-height:38px;
    line-height:1.4;
  }
  .checklabel{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13.5px;
    font-weight:500;
    color:var(--ink);
    text-transform:none;
    cursor:pointer;
  }
  .checklabel input{width:auto;}
  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    border:none;
    border-radius:9px;
    padding:9px 14px;
    cursor:pointer;
    transition:transform .08s, opacity .15s;
    white-space:nowrap;
  }
  button:active{transform:scale(.97);}
  .btn-primary{background:var(--pitch); color:#fff;}
  .btn-primary:hover{background:var(--pitch-dark);}
  .btn-ghost{background:transparent; color:var(--taken); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--sage-bg);}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid #E8CFCC;}
  .btn-danger:hover{background:#FBEFED;}
  .btn-amber{background:var(--amber); color:#26200F;}
  .btn-amber:hover{background:var(--amber-dark); color:#fff;}
  .announcement{
    background:var(--amber);
    color:#26200F;
    padding:13px 15px;
    border-radius:var(--radius);
    margin-bottom:16px;
    font-size:14px;
    font-weight:600;
    line-height:1.45;
  }
  .mapblock{margin-bottom:14px;}
  .campmap{
    width:100%;
    height:auto;
    display:block;
    border-radius:var(--radius);
    border:1px solid var(--line);
    margin-top:8px;
  }
  .partitefilters{margin-bottom:6px;}
  .filterrow{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:8px;
  }
  .filterpill{
    background:var(--card);
    border:1px solid var(--line);
    color:var(--taken);
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:600;
    padding:6px 12px;
    border-radius:999px;
  }
  .filterpill.active{
    background:var(--pitch);
    border-color:var(--pitch);
    color:#fff;
  }
  .matchdaybar{
    background:var(--pitch-dark);
    color:#fff;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:.04em;
    padding:10px 14px;
    border-radius:8px;
    margin:18px 0 10px;
  }
  .matchdaybar:first-child{margin-top:0;}
  .matchrow{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 12px;
    border-radius:10px;
    margin-bottom:8px;
    border-left:5px solid var(--line);
    background:var(--card);
  }
  .matchrow.team-tequila{background:var(--team-tequila-bg); border-left-color:var(--team-tequila);}
  .matchrow.team-cotarica{background:var(--team-cotarica-bg); border-left-color:var(--team-cotarica);}
  .matchrow .mtime{flex:none; width:50px;}
  .matchrow .mtime .start{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--ink);
  }
  .matchrow .mtime .end{font-size:10.5px; color:var(--taken); margin-top:1px;}
  .matchrow .mlogo{
    width:36px;
    height:36px;
    border-radius:9px;
    object-fit:cover;
    flex:none;
  }
  .matchrow .minfo{flex:1; min-width:0;}
  .matchrow .mteam{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:13.5px;
    line-height:1.25;
    word-break:break-word;
  }
  .matchrow.team-tequila .mteam{color:var(--team-tequila);}
  .matchrow.team-cotarica .mteam{color:var(--team-cotarica);}
  .matchrow .mvs{font-size:12.5px; color:var(--ink); margin-top:1px; word-break:break-word;}
  .matchrow .mfield{flex:none; display:flex; flex-direction:column; align-items:center; gap:2px;}
  .matchrow .fieldnum{
    width:32px;
    height:32px;
    border-radius:50%;
    border:2px solid var(--taken);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--ink);
  }
  .matchrow.team-tequila .fieldnum{border-color:var(--team-tequila); color:var(--team-tequila);}
  .matchrow.team-cotarica .fieldnum{border-color:var(--team-cotarica); color:var(--team-cotarica);}
  .matchrow .fieldlabel{font-size:8px; color:var(--taken); text-transform:uppercase; letter-spacing:.03em;}
  .empty{
    text-align:center;

    padding:50px 20px;
    color:var(--taken);
  }
  .empty .icon{font-size:34px; margin-bottom:8px;}
  .loginbox{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 18px;
    margin-top:20px;
  }
  .loginbox h3{margin:0 0 4px; font-size:17px;}
  .loginbox p{margin:0 0 16px; font-size:13.5px; color:var(--taken);}
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--taken);
    margin-bottom:5px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .loginerr{
    color:var(--danger);
    font-size:13px;
    margin-top:10px;
    display:none;
  }
  .adminbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  .adminbar .who{font-size:13px; color:var(--taken);}
  .adminbar .who b{color:var(--pitch-dark);}
  .addcard{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:20px;
  }
  .addcard h3{margin:0 0 12px; font-size:15px;}
  .addgrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:12px;
  }
  .addgrid .full{grid-column:1/-1;}
  .addgrid label{
    display:block;
    font-size:11px;
    font-weight:600;
    color:var(--taken);
    margin-bottom:4px;
    text-transform:uppercase;
  }
  .rowactions{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:9px;
  }
  .rowactions button{
    flex:1 1 auto;
    min-width:0;
    white-space:normal;
  }
  .sectiontitle{
    font-size:13px;
    font-weight:700;
    color:var(--pitch-dark);
    text-transform:uppercase;
    letter-spacing:.04em;
    margin:22px 0 10px;
  }
  .note{
    font-size:12px;
    color:var(--taken);
    text-align:center;
    margin-top:24px;
    line-height:1.5;
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%) translateY(10px);
    background:var(--pitch-dark);
    color:#fff;
    padding:11px 18px;
    border-radius:16px;
    font-size:13.5px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:50;
    box-shadow:0 6px 20px rgba(0,0,0,.2);
    max-width:min(88vw, 360px);
    width:max-content;
    white-space:normal;
    word-break:break-word;
    text-align:center;
    line-height:1.4;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; cursor:pointer;}
  .spin{
    text-align:center;
    padding:40px;
    color:var(--taken);
    font-size:13.5px;
  }
  .adminsubnav{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .subtabbtn{
    background:var(--card);
    border:1px solid var(--line);
    color:var(--taken);
    font-size:13px;
    padding:8px 14px;
    border-radius:999px;
  }
  .subtabbtn.active{
    background:var(--pitch);
    border-color:var(--pitch);
    color:#fff;
  }
  .riepilogohead{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:18px;
  }
  .riepstat{
    font-size:13px;
    color:var(--taken);
  }
  .riepstat b{
    font-family:'Space Grotesk',sans-serif;
    color:var(--pitch-dark);
    font-size:16px;
    margin-right:4px;
  }
  .riepilogohead button{margin-left:auto;}
  .riepilogotable{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .rieprow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .rieprow:last-child{border-bottom:none;}
  .riepphysio{
    font-size:12px;
    color:var(--taken);
    font-weight:500;
  }
  .rieptime{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    color:var(--ink);
  }
  .riepname{
    font-weight:600;
    color:var(--pitch-dark);
    word-break:break-word;
    flex:1;
    min-width:0;
    text-align:right;
    margin-left:8px;
  }
  .riepname.riepfree{
    font-weight:400;
    font-style:italic;
    color:var(--taken);
  }
  @media print{
    header.top, .no-print{ display:none !important; }
    body{ background:#fff; padding-bottom:0; }
    .daygroup{ break-inside:avoid; }
  }
  .diagcard{
    background:var(--card);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-top:24px;
  }
  .diagcard h3{margin:0 0 4px; font-size:14px;}
  .diagcard p{margin:0 0 12px; font-size:12.5px; color:var(--taken);}
  .diagline{
    font-size:13px;
    padding:8px 10px;
    border-radius:8px;
    margin-top:8px;
    word-break:break-word;
  }
  .diag-ok{background:var(--free-bg); color:var(--free);}
  .diag-fail{background:#FBEFED; color:var(--danger);}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">

function isConfigured(){
  return FIREBASE_URL && FIREBASE_URL.indexOf('http') === 0;
}

// ---------- storage (Firebase Realtime Database REST API) ----------
async function fetchSlots(){
  if(!isConfigured()) return [];
  try{
    const res = await fetch(`${FIREBASE_URL}/${DATA_PATH}.json`);
    if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
    const data = await res.json();
    return Array.isArray(data) ? data.filter(Boolean) : [];
  }catch(e){
    return [];
  }
}
async function persistSlots(newSlots, attempt){
  attempt = attempt || 1;
  if(!isConfigured()){
    lastSaveError = 'App non ancora configurata: manca l\'URL del database.';
    return false;
  }
  try{
    const res = await fetch(`${FIREBASE_URL}/${DATA_PATH}.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(newSlots)
    });
    if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
    lastSaveError = '';
    return true;
  }catch(e){
    if(attempt < 4){
      await new Promise(r=>setTimeout(r, 500*attempt));
      return persistSlots(newSlots, attempt+1);
    }
    lastSaveError = (e && e.message) ? e.message : String(e);
    return false;
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  const duration = Math.min(8000, Math.max(2200, msg.length * 70));
  t._hideTimer = setTimeout(()=>t.classList.remove('show'), duration);
  t.onclick = ()=>{ clearTimeout(t._hideTimer); t.classList.remove('show'); };
}

// ---------- helpers ----------
function pad(n){ return String(n).padStart(2,'0'); }
function addMinutes(time, mins){
  const [h,m] = time.split(':').map(Number);
  const total = h*60+m+Number(mins);
  const eh = Math.floor((total%1440)/60), em = total%60;
  return pad(eh)+':'+pad(em);
}
function formatDay(dateStr){
  if(!dateStr) return 'Senza data';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return dateStr;
  return d.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'});
}
function groupByDay(list){
  const groups = {};
  list.forEach(s=>{
    const key = s.date || 'zzz';
    if(!groups[key]) groups[key] = [];
    groups[key].push(s);
  });
  return Object.keys(groups).sort().map(key=>({
    date:key, items: groups[key].sort((a,b)=> a.time.localeCompare(b.time))
  }));
}
function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}
function physioOptions(selected){
  return ADMINS.map(a => `<option value="${a.name}" ${a.name===selected?'selected':''}>${a.name}</option>`).join('');
}

function formatDayShort(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return dateStr;
  const s = d.toLocaleDateString('it-IT', {weekday:'short', day:'numeric', month:'numeric'});
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function escapeJs(str){
  return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

}

async function bookSlot(id){
  const input = document.getElementById('name-'+id);
  const name = (input.value || '').trim();
  if(!name){
    input.focus();
    return;
  }
  const noteInput = document.getElementById('note-'+id);
  const note = noteInput ? (noteInput.value || '').trim() : '';
  input.disabled = true;
  busy = true;
  try{
    slots = await fetchSlots();
    const slot = slots.find(s=>s.id===id);
    if(!slot){ showToast('Questo slot non esiste più.'); loaded=true; bookingOpenId = null; renderAtleta(); return; }
    if(slot.name){ showToast('Slot appena occupato da un altro atleta.'); bookingOpenId = null; renderAtleta(); return; }
    slot.name = name;
    slot.note = note || null;
    slot.bookedAt = Date.now();
    const ok = await persistSlots(slots);
    if(ok){ showToast('Prenotazione confermata ✓'); bookingOpenId = null; }
    else { showToast('Errore nel salvataggio: ' + (lastSaveError || 'riprova')); slot.name = null; slot.note = null; }
    renderAtleta();
  } catch(e){
    showToast('Errore: ' + e.message);
    renderAtleta();
  } finally {
    busy = false;
  }
}

async function cancelBooking(id){
  if(!confirm('Annullare questa prenotazione?')) return;
  busy = true;
  try{
    slots = await fetchSlots();
    const slot = slots.find(s=>s.id===id);
    if(!slot) return;
    slot.name = null;
    slot.note = null;
    slot.bookedAt = null;
    slot.done = false;
    const ok = await persistSlots(slots);
    if(ok) showToast('Prenotazione annullata');
    else showToast('Errore nel salvataggio: ' + (lastSaveError || 'riprova'));
    if(currentTab==='admin') renderAdmin(); else renderAtleta();
  } catch(e){
    showToast('Errore: ' + e.message);
  } finally {
    busy = false;
  }
}

async function toggleDone(id){
  busy = true;
  try{
    slots = await fetchSlots();
    const slot = slots.find(s=>s.id===id);
    if(!slot) return;
    const newDone = !slot.done;
    slot.done = newDone;
    const ok = await persistSlots(slots);
    if(ok) showToast(newDone ? 'Trattamento segnato come svolto ✓' : 'Segnato come non svolto');
    else { showToast('Errore nel salvataggio: ' + (lastSaveError || 'riprova')); slot.done = !newDone; }
    renderAdmin();
  } catch(e){
    showToast('Errore: ' + e.message);
  } finally {
    busy = false;
  }
}

    </div>`;

  if(slots.length===0){
    html += `<div class="empty"><div class="icon">📋</div>Non hai ancora inserito slot.</div>`;
  } else {
    html += `<div class="sectiontitle">Slot inseriti (${slots.length})</div>`;
    const groups = groupByDay(slots);
    groups.forEach(g=>{
      html += `<div class="daygroup"><div class="dayhead"><span class="dname">${formatDay(g.date)}</span></div>`;
      g.items.forEach(s=>{
        const end = addMinutes(s.time, s.duration);
        const free = !s.name;
        const editing = editingAdminId === s.id;
        html += `<div class="slotcard">
          <div class="disc ${free?'free':(s.done?'done':'taken')}"><span class="n">${s.duration}</span><span class="u">min</span></div>
          <div class="slotinfo">
            ${editing ? `
            <div class="addgrid" style="margin-top:2px;">
              <div><label>Data</label><input type="date" id="edit-date-${s.id}" value="${s.date}"></div>
              <div><label>Orario</label><input type="time" id="edit-time-${s.id}" value="${s.time}"></div>
              <div><label>Durata (min)</label><input type="number" id="edit-dur-${s.id}" value="${s.duration}" min="5" step="5"></div>
              <div><label>Fisioterapista</label><select id="edit-physio-${s.id}">${physioOptions(s.physio)}</select></div>
              <div class="full"><label>Nome (vuoto = libero)</label><input type="text" id="edit-name-${s.id}" value="${s.name ? escapeHtml(s.name) : ''}" maxlength="60"></div>
              <div class="full"><label>Nota</label><textarea class="autonote" id="edit-note-${s.id}" maxlength="140" rows="1" oninput="autoGrow(this)">${s.note ? escapeHtml(s.note) : ''}</textarea></div>
              <div class="full"><label class="checklabel"><input type="checkbox" id="edit-done-${s.id}" ${s.done?'checked':''}> Trattamento svolto</label></div>
            </div>
            <div class="rowactions">
              <button class="btn-primary" onclick="saveAdminEdit('${s.id}')">Salva modifiche</button>
              <button class="btn-ghost" onclick="toggleEditAdmin(null)">Annulla</button>
            </div>` : `
            <span class="slottime">${s.time}–${end}</span>
            <span class="statuspill ${free?'free':(s.done?'done':'taken')}">${free?'Libero':(s.done?'Svolto ✓':'Occupato')}</span>
            ${s.physio ? `<div class="notetext">Fisio: <b>${escapeHtml(s.physio)}</b></div>` : ''}
            ${s.insertedBy ? `<div class="notetext">Inserito da: <b>${escapeHtml(s.insertedBy)}</b></div>` : ''}
            ${!free ? `<div class="bookedname">Prenotato da <b>${escapeHtml(s.name)}</b></div>` : ''}
            ${s.note ? `<div class="notetext">Nota: <b>${escapeHtml(s.note)}</b></div>` : ''}
            <div class="rowactions">
              <button class="btn-ghost" onclick="toggleEditAdmin('${s.id}')">Modifica</button>
              ${!free ? `<button class="btn-ghost" onclick="toggleDone('${s.id}')">${s.done?'Segna non svolto':'Segna svolto ✓'}</button>` : ''}
              ${!free ? `<button class="btn-ghost" onclick="cancelBooking('${s.id}')">Libera slot</button>` : ''}
              <button class="btn-danger" onclick="deleteSlot('${s.id}')">Elimina</button>
            </div>`}
          </div>
        </div>`;
      });
      html += `</div>`;
    });
  }
  html += `<div class="diagcard">
      <h3>Problemi di connessione?</h3>
      <p>Esegue un test diretto di lettura e scrittura sul database Firebase, e mostra l'esito reale.</p>
      <button class="btn-ghost" onclick="runDiagnostics()">Esegui diagnostica</button>
      <div id="diag-result"></div>
    </div>`;
  return html;
}

function buildRiepilogoHtml(){
  if(slots.length===0){
    return `<div class="empty"><div class="icon">📋</div>Non ci sono slot da riepilogare.</div>`;
  }
  const total = slots.length;
  const booked = slots.filter(s=>s.name).length;
  const done = slots.filter(s=>s.name && s.done).length;
  let html = `<div class="riepilogohead no-print">
      <div class="riepstat"><b>${total}</b> slot totali</div>
      <div class="riepstat"><b>${booked}</b> prenotati</div>
      <div class="riepstat"><b>${total-booked}</b> liberi</div>
      <div class="riepstat"><b>${done}</b> svolti</div>
      <button class="btn-ghost" onclick="window.print()">Stampa</button>
    </div>`;
  const groups = groupByDay(slots);
  groups.forEach(g=>{
    html += `<div class="daygroup"><div class="dayhead"><span class="dname">${formatDay(g.date)}</span></div>
      <div class="riepilogotable">`;
    g.items.forEach(s=>{
      const end = addMinutes(s.time, s.duration);
      html += `<div class="rieprow">
        <span class="rieptime">${s.time}–${end}</span>
        <span class="riepphysio">${s.physio ? escapeHtml(s.physio) : ''}</span>
        <span class="riepname ${s.name?'':'riepfree'}">${s.name ? escapeHtml(s.name) + (s.done ? ' ✓' : '') : 'Libero'}</span>
      </div>`;
    });
    html += `</div></div>`;
  });
  return html;
}

  isAdmin = false;
  currentAdminName = '';

async function addSlot(){
  const date = document.getElementById('new-date').value;
  const time = document.getElementById('new-time').value;
  const dur = Number(document.getElementById('new-dur').value);
  const physio = document.getElementById('new-physio').value;
  if(!date || !time || !dur || dur<=0){
    showToast('Compila data, orario e durata.');

  }
  busy = true;
  try{

    else showToast('Errore nel salvataggio: ' + (lastSaveError || 'riprova'));

function timeToMin(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }

async function generateSlots(){
  const date = document.getElementById('bulk-date').value;
  const start = document.getElementById('bulk-start').value;
  const end = document.getElementById('bulk-end').value;
  const every = Number(document.getElementById('bulk-every').value);
  const dur = Number(document.getElementById('bulk-dur').value);
  const physio = document.getElementById('bulk-physio').value;

  if(!date || !start || !end || !every || every<=0 || !dur || dur<=0){
    showToast('Compila tutti i campi correttamente.');
    return;
  }
  const startMin = timeToMin(start);
  const endMin = timeToMin(end);
  if(endMin < startMin){
    showToast('L\'ora di fine deve essere uguale o dopo l\'ora di inizio.');
    return;
  }

  busy = true;
  try{
    slots = await fetchSlots();
    const existingKeys = new Set(slots.filter(s=>s.date===date).map(s=>s.time + '|' + (s.physio||'')));

    const toAdd = [];
    let skipped = 0;
    // do-while: se inizio e fine coincidono, genera comunque un unico slot
    let m = startMin;
    do{
      const t = pad(Math.floor(m/60))+':'+pad(m%60);
      const key = t + '|' + physio;
      if(existingKeys.has(key)){ skipped++; }
      else{
        toAdd.push({ id: uid(), date, time: t, duration: dur, physio, insertedBy: currentAdminName, name: null, note: null, done: false, bookedAt: null });
        existingKeys.add(key);
      }
      m += every;
    } while(m < endMin);

    if(toAdd.length === 0){
      showToast(skipped>0 ? 'Tutti quegli orari esistevano già per questo fisio.' : 'Nessuno slot generato.');
      return;
    }

    slots = slots.concat(toAdd);
    const ok = await persistSlots(slots);
    if(ok){
      showToast(`${toAdd.length} slot aggiunti` + (skipped>0 ? ` (${skipped} già esistenti, saltati)` : ''));
    } else {
      showToast('Errore nel salvataggio: ' + (lastSaveError || 'riprova'));
    }
    renderAdmin();
  } catch(e){
    showToast('Errore: ' + e.message);
  } finally {
    busy = false;
  }
}

async function deleteSlot(id){
  if(!confirm('Eliminare definitivamente questo slot?')) return;
  busy = true;
  try{
    slots = await fetchSlots();
    slots = slots.filter(s=>s.id!==id);
    const ok = await persistSlots(slots);
    if(ok) showToast('Slot eliminato');
    else showToast('Errore nel salvataggio: ' + (lastSaveError || 'riprova'));
    renderAdmin();
  } catch(e){
    showToast('Errore: ' + e.message);
  } finally {
    busy = false;
  }
}

function toggleEditAdmin(id){
  editingAdminId = id;
  renderAdmin();
}

async function saveAdminEdit(id){
  const date = document.getElementById('edit-date-'+id).value;
  const time = document.getElementById('edit-time-'+id).value;
  const dur = Number(document.getElementById('edit-dur-'+id).value);
  const physio = document.getElementById('edit-physio-'+id).value;
  const name = document.getElementById('edit-name-'+id).value.trim();
  const note = document.getElementById('edit-note-'+id).value.trim();
  const done = document.getElementById('edit-done-'+id).checked;
  if(!date || !time || !dur || dur<=0){
    showToast('Compila data, orario e durata.');
    return;
  }
  busy = true;
  try{
    slots = await fetchSlots();
    const slot = slots.find(s=>s.id===id);
    if(!slot){ showToast('Questo slot non esiste più.'); editingAdminId = null; renderAdmin(); return; }
    slot.date = date;
    slot.time = time;
    slot.duration = dur;
    slot.physio = physio;
    slot.name = name || null;
    slot.note = name ? (note || null) : null;
    slot.done = name ? done : false;
    if(!name) slot.bookedAt = null;
    const ok = await persistSlots(slots);
    if(ok) showToast('Slot aggiornato');
    else showToast('Errore nel salvataggio: ' + (lastSaveError || 'riprova'));
    editingAdminId = null;
    renderAdmin();
  } catch(e){
    showToast('Errore: ' + e.message);
  } finally {
    busy = false;
  }
}

async function runDiagnostics(){
  const box = document.getElementById('diag-result');

  if(!isConfigured()){
    box.innerHTML = '<div class="diagline diag-fail">✗ URL del database non ancora configurato. Incolla l\'URL di Firebase nella riga FIREBASE_URL in cima al file.</div>';
    return;
  }

  box.innerHTML = '<div class="diagline">Test in corso…</div>';
  const lines = [];
  const val = String(Date.now());

  try{
    const setRes = await fetch(`${FIREBASE_URL}/${DIAG_PATH}.json`, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(val)
    });
    if(!setRes.ok) throw new Error('scrittura: HTTP ' + setRes.status + ' ' + setRes.statusText);

    const getRes = await fetch(`${FIREBASE_URL}/${DIAG_PATH}.json`);
    if(!getRes.ok) throw new Error('lettura: HTTP ' + getRes.status + ' ' + getRes.statusText);
    const data = await getRes.json();
    if(data !== val) throw new Error('la rilettura non corrisponde al valore scritto');

    lines.push('<div class="diagline diag-ok">✓ Connessione a Firebase: lettura e scrittura funzionano</div>');
  }catch(e){
    lines.push(`<div class="diagline diag-fail">✗ Connessione a Firebase: ${escapeHtml((e && e.message) ? e.message : String(e))}</div>`);
  }

  box.innerHTML = lines.join('');
}

function switchTab(tab){
  currentTab = tab;
  document.getElementById('tab-atleta').classList.toggle('active', tab==='atleta');
  document.getElementById('tab-partite').classList.toggle('active', tab==='partite');
  document.getElementById('tab-admin').classList.toggle('active', tab==='admin');
  if(tab==='atleta') renderAtleta();
  else if(tab==='partite') renderPartite();
  else renderAdmin();
}

async function refresh(){
  if(busy) return;
  const [newSlots, newMessage, newMatches] = await Promise.all([fetchSlots(), fetchMessage(), fetchMatches()]);
  slots = newSlots;
  announcement = newMessage;
  matches = newMatches;
  loaded = true;
  if(currentTab==='atleta') renderAtleta();
  else if(currentTab==='partite') renderPartite();
  else if(isAdmin) renderAdmin();
}

(async function init(){
  renderAtleta();
  await refresh();
  pollTimer = setInterval(async ()=>{
    const active = document.activeElement;
    const typing = active && typeof active.matches === 'function' && active.matches('input, textarea');
    if((currentTab==='atleta' || currentTab==='partite') && !typing && !busy){
      await refresh();
    }
  }, 8000);
})();
</script>
